# nginx principal de la EC2 de Vapeupar. Sustituye al de Amazon Linux 2023.
# docs/aws-full-deployment-plan.md F2.
#
# ES EL DE AL2023 SIN SU BLOQUE `server`. El original trae un servidor propio
# en el puerto 80 (`server_name _`, raíz en /usr/share/nginx/html) que
# competiría con el de `conf.d/vapeupar.conf` por las peticiones sin nombre:
# con dos `server_name _` en el mismo puerto, gana el que se lea primero, y
# eso depende del orden de los `include`. Quitándolo, solo hay uno.
#
# El sitio vive en `conf.d/vapeupar.conf` y no aquí porque certbot (F4) edita
# el bloque `server` del sitio para añadir el TLS, y es más seguro que toque un
# archivo pequeño y de un solo propósito.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # No anunciar la versión de nginx en cabeceras ni páginas de error.
    server_tokens off;

    # --- Límite de peticiones (F7, dec-proteccion-perimetral) ---------------
    # Las ZONAS van aquí porque `limit_req_zone` y `limit_conn_zone` solo
    # valen en contexto `http`; quien las USA es site.inc (contexto `server` y
    # `location`). activate.sh instala este archivo y site.inc en el mismo
    # paso y los prueba juntos con `nginx -t`; si la prueba o la verificación
    # de la release fallan, restaura la copia de los dos (y de vapeupar.conf)
    # antes de salir: nunca queda en disco un site.inc que nombre una zona que
    # no existe.
    #
    # Clave $binary_remote_addr: la IP que ve nginx, que es la del cliente (no
    # hay CloudFront ni balanceador delante) y no se puede falsear con
    # X-Forwarded-For. 4 o 16 bytes por IP: 1 MB son ~16 000 IP.
    #
    # Va DELANTE del rate limit de Express (backend/src/app.ts), no en su
    # lugar: Express da el mensaje bonito y cuenta solo los fallos del login;
    # nginx corta las ráfagas antes de que lleguen a Node (instancia de 1 GB).
    #   auth:  inicio de sesión, cambio de contraseña y MFA. 10/min con
    #          ráfaga de 5: 1 + 5 pasan seguidas y la 7.ª recibe 429.
    #   admin: resto de /api/admin (incluido el presign de imágenes). Holgado
    #          (60/min, ráfaga 60) para que salte antes el de Express (30/min).
    limit_req_zone $binary_remote_addr zone=vapeupar_auth:1m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=vapeupar_admin:1m rate=60r/m;
    # Peticiones simultáneas por IP en todo el sitio (en HTTP/2 cada flujo
    # cuenta como una conexión). Muy por encima de lo que pide un navegador al
    # cargar la tienda, también varios detrás de la misma IP (CGNAT).
    limit_conn_zone $binary_remote_addr zone=vapeupar_conn:1m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
