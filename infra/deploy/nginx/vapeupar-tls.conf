# Sitio de Vapeupar CON TLS (F4). activate.sh lo instala como
# /etc/nginx/conf.d/vapeupar.conf cuando existe el certificado
# /etc/letsencrypt/live/vapeupar/ (nombre fijo con `--cert-name vapeupar`,
# así este archivo no depende del nombre de No-IP ni de un dominio futuro).
#
# certbot NO edita este archivo: el certificado se obtiene con
# `certbot certonly --nginx` y se renueva con el temporizador del paquete,
# que recarga nginx con el deploy-hook. Por eso activa.sh puede seguir
# instalando el sitio en cada despliegue sin perder el TLS.

upstream vapeupar_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream vapeupar_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP: todo a HTTPS. Sin excepción para /.well-known: la renovación usa el
# autenticador de nginx de certbot, que monta su propio bloque temporal.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/vapeupar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vapeupar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vapeupar_tls:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: activar SOLO tras comprobar que todo carga por https (F4, paso 5).
    # Una vez enviado, los navegadores se niegan a volver a http durante
    # max-age aunque el certificado falle; por eso no va desde el primer día.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/vapeupar/site.inc;
}
