# Sitio de Vapeupar SOLO HTTP: tienda, consola y API desde un mismo origen.
# docs/aws-full-deployment-plan.md F2 y F4.
#
# Es la variante que activa.sh instala mientras NO exista el certificado
# (/etc/letsencrypt/live/vapeupar/). En cuanto existe, instala
# `vapeupar-tls.conf` en su lugar. Las rutas viven en `vapeupar-site.inc`,
# común a las dos.
#
# UN SOLO ORIGEN es lo que permite compilar el frontend con la API relativa
# (`NEXT_PUBLIC_API_URL=/api`): el navegador llama a `/api/...` en el mismo
# sitio que sirve la página, y aquí se reparte. Por eso pasar de IP a nombre
# de No-IP o a dominio no obliga a recompilar.

upstream vapeupar_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream vapeupar_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/vapeupar/site.inc;
}
