# Límites del journal de la instancia (registros de vapeupar-backend,
# vapeupar-frontend, vapeupar-env, vapeupar-metrics y el sistema). Los
# registros NO se envían a CloudWatch Logs (decisión dec-enviar-logs-a-cloudwatch):
# se leen por SSM, p. ej. `journalctl -u vapeupar-backend --since -1h`.
# Lo instala deploy/activate.sh en /etc/systemd/journald.conf.d/.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=14day
