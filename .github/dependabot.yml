# Actualizaciones automáticas en forma de PR a `main` (pasan por ci.yml como
# cualquier otro cambio). docs/infrastructure-aws.md, «Flujo de despliegue».
version: 2
updates:
  # Las actions van fijadas por SHA en los workflows; Dependabot mueve el SHA y
  # el comentario de la versión a la vez.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Monorepo con workspaces: un solo lockfile en la raíz. Agrupadas para no
  # recibir un PR por paquete; las versiones mayores van aparte porque son las
  # que pueden romper.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      menores:
        update-types: [minor, patch]
    # Versiones mayores que se actualizan a propósito, en su propio PR, no
    # cuando las proponga Dependabot. Las alertas de seguridad siguen llegando.
    ignore:
      # Tipos de Node: siguen a la versión de la instancia (Node 22,
      # NODE_VERSION en infra/lib/app-stack.ts), no a la última de Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Cambian la API o las reglas: express 5 (rutas y errores), TypeScript 7
      # (compilador nuevo), ESLint 10 (configuración y reglas).
      - dependency-name: express
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
